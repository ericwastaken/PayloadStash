# TLS-enabled broker config. Keeps the plaintext listener (5672) for declare.py/drain.py
# and adds an amqps listener (5671) using the test certs mounted at /certs.
loopback_users = none
listeners.tcp.default = 5672
listeners.ssl.default = 5671
ssl_options.cacertfile = /certs/ca.pem
ssl_options.certfile   = /certs/server_certificate.pem
ssl_options.keyfile    = /certs/server_key.pem
ssl_options.verify     = verify_none
ssl_options.fail_if_no_peer_cert = false
