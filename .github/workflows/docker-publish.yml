name: Build and publish Docker image

on:
  release:
    types:
      - published

concurrency:
  group: docker-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Validate and publish release image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the released source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Validate release version and source
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          semver = re.compile(
              r"^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)"
              r"(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?"
              r"(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$"
          )
          if semver.fullmatch(tag) is None:
              raise SystemExit(f"Release tag must be valid SemVer beginning with v: {tag}")

          release_version = tag[1:]
          with Path("pyproject.toml").open("rb") as stream:
              project_version = tomllib.load(stream)["project"]["version"]

          init_text = Path("payload_stash/__init__.py").read_text(encoding="utf-8")
          init_match = re.search(
              r'^__version__\s*=\s*["\']([^"\']+)["\']\s*$',
              init_text,
              flags=re.MULTILINE,
          )
          if init_match is None:
              raise SystemExit("Could not read __version__ from payload_stash/__init__.py")

          init_version = init_match.group(1)
          if project_version != release_version or init_version != release_version:
              raise SystemExit(
                  "Release version mismatch: "
                  f"tag={release_version}, pyproject={project_version}, package={init_version}"
              )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"version={release_version}\n")
          print(f"Validated release version {release_version}")
          PY

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is not contained in origin/main" >&2
            exit 1
          fi

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run test suite
        run: |
          python tests/test_asserts.py
          python tests/test_header_case.py
          python tests/test_url_operators.py
          python tests/test_amqp.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          tags: payloadstash:release-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test release candidate image
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          actual_version="$(docker run --rm payloadstash:release-candidate --version | awk '{print $NF}')"
          if [[ "$actual_version" != "$EXPECTED_VERSION" ]]; then
            echo "Container version mismatch: expected $EXPECTED_VERSION, got $actual_version" >&2
            exit 1
          fi
          docker run --rm payloadstash:release-candidate --help >/dev/null

      - name: Extract release image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
