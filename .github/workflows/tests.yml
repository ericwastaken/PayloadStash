name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run test suite
        run: |
          python tests/test_asserts.py
          python tests/test_header_case.py
          python tests/test_url_operators.py
          python tests/test_amqp.py
          python tests/test_expect_features.py
